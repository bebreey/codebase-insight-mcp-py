name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: py ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
            coverage: true
          - os: windows-latest
            python: '3.12'
          - os: macos-latest
            python: '3.12'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test (unit + integration + protocol e2e)
        run: pytest

      - name: Coverage
        if: matrix.coverage
        run: pytest --cov=codebase_insight --cov-report=term-missing --cov-report=xml

      - name: Smoke test the installed entry point
        run: |
          codebase-insight-mcp-py --version
          codebase-insight-mcp-py --list-tools

      - name: Run the end-to-end demo
        run: python scripts/demo.py

      - name: Upload coverage
        if: matrix.coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7
