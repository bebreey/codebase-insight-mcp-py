[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codebase-insight-mcp-py"
version = "1.0.0"
description = "Offline, read-only MCP server that gives AI agents a precise picture of a local codebase. Python implementation with AST-level symbol extraction and real .gitignore support."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "bebreey" }]
keywords = ["mcp", "model-context-protocol", "ai-agent", "codebase-analysis", "static-analysis", "python"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "mcp>=2.3.0",
  "pathspec>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6",
  "ruff>=0.9",
]

[project.urls]
Repository = "https://github.com/bebreey/codebase-insight-mcp-py"
Source = "https://github.com/bebreey/codebase-insight-mcp-py"

[project.scripts]
codebase-insight-mcp-py = "codebase_insight.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codebase_insight"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]
# The fixture repository is analyser input, not project code.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PTH", "RUF"]
ignore = [
  # Long tool descriptions read better as multi-line strings.
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["codebase_insight"]

[tool.mypy]
python_version = "3.11"
files = ["src/codebase_insight"]
strict = true
warn_unreachable = true
show_error_codes = true
pretty = false
# The MCP SDK ships inline types, but a couple of third-party modules do not.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mcp_types", "mcp_types.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/codebase_insight"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "@(abc\\.)?abstractmethod",
]
